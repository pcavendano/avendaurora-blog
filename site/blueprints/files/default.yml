title: Imagen

accept:
  mime: image/jpeg, image/png, image/webp, image/gif, image/svg+xml
  maxsize: 10485760

fields:
  alt:
    label: Texto alternativo
    type: text
    translate: true
    help: Describe la imagen para lectores de pantalla y SEO

  caption:
    label: Pie de foto
    type: textarea
    translate: true
    size: small

  credit:
    label: Crédito
    type: text
    help: Fotógrafo o fuente, si aplica