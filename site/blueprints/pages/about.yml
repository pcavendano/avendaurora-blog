title: Sobre Nosotros
icon: 👨‍🍳

columns:
  main:
    width: 2/3
    sections:
      hero:
        type: fields
        fields:
          title:
            label: Título
            type: text
            translate: true
            default: Sobre Aurora

          subtitle:
            label: Subtítulo (Cargo)
            type: text
            translate: true
            placeholder: "Chef Profesional | Montreal, Quebec"

          portrait:
            label: Foto Principal del Chef
            type: files
            max: 1
            layout: cards
            size: large
            help: Foto horizontal del chef en accion (recomendado 1600x900px o mas ancha)

          intro:
            label: Introducción
            type: textarea
            translate: true
            size: small
            help: Texto breve que aparece junto a la foto

      body:
        type: fields
        fields:
          body:
            label: Contenido
            type: blocks
            translate: true
            help: Arrastra los componentes para reordenarlos. Pulsa el botón **+** para añadir uno nuevo.
            fieldsets:
              - heading
              - text
              - quote
              - education
              - experience
              - signature-dishes
              - gallery
            empty: Añade componentes para construir esta página

  sidebar:
    width: 1/3
    sections:
      specialties:
        type: fields
        fields:
          specialties_title:
            label: Título de Sección
            type: text
            default: Especialidades

          specialties:
            label: Especialidades
            type: tags
            translate: true
            help: Lista de especialidades culinarias

      notable:
        type: fields
        fields:
          notable_places_title:
            label: Título de Sección
            type: text
            default: Lugares Destacados

          notable_places:
            label: Lugares Notables
            type: textarea
            size: small
            help: Lista de restaurantes/hoteles destacados

      contact:
        type: fields
        fields:
          contact_title:
            label: Título de Sección
            type: text
            default: Contacto

          contact_intro:
            label: Texto de Contacto
            type: textarea
            size: small

          email:
            label: Email
            type: email

      seo:
        type: fields
        fields:
          seo_title:
            label: SEO Título
            type: text
            counter: 60

          seo_description:
            label: SEO Descripción
            type: textarea
            counter: 160
