title: Contacto
icon: 📬

columns:
  main:
    width: 2/3
    sections:
      hero:
        type: fields
        fields:
          title:
            label: Título
            type: text
            translate: true
            default: Contacto

          intro:
            label: Introducción
            type: textarea
            translate: true
            size: small
            help: Texto breve que aparece bajo el título

      contact_info:
        type: fields
        fields:
          email:
            label: Correo Electrónico
            type: email
            help: Se muestra como botón "Enviar Email"

          phone:
            label: Teléfono
            type: tel

          location:
            label: Ubicación
            type: text
            translate: true
            placeholder: "Montreal, Quebec, Canada"

      body:
        type: fields
        fields:
          body:
            label: Contenido adicional
            type: textarea
            translate: true
            size: large
            help: Información adicional, horario de respuesta, etc.

  sidebar:
    width: 1/3
    sections:
      seo:
        type: fields
        fields:
          seo_title:
            label: Título SEO
            type: text
            translate: true

          seo_description:
            label: Descripción SEO
            type: textarea
            translate: true
            counter: 160