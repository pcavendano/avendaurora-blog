name: Trayectoria
icon: briefcase
label: "{{ block.title }}"
preview: fields

fields:
  title:
    label: Título de la Sección
    type: text
    translate: true
    default: Trayectoria Profesional

  entries:
    label: Entradas
    type: structure
    translate: true
    fields:
      period:
        label: Período
        type: text
        width: 1/4
        placeholder: "2023 - 2024"
      position:
        label: Puesto
        type: text
        translate: true
        width: 3/4
      place:
        label: Lugar / Empresa
        type: text
        translate: true
      description:
        label: Descripción
        type: textarea
        translate: true
        size: small
